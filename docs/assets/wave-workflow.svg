<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">From HPC workloads and energy inputs to simulation results</title>
  <desc id="desc">Choose machine, workload and energy inputs. WAVE combines job scheduling, DVFS and energy budgets in a Vessim co-simulation. Inspect job metrics, energy flows and operational grid emissions.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7890a5" stroke-width="1.5"/></marker></defs>
  <rect width="1120" height="360" rx="20" fill="#f6f9fc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="32" y="44" font-size="14" font-weight="700" letter-spacing="2" fill="#516c82">AN EXPERIMENT IN WAVE</text>
    <rect x="32" y="76" width="304" height="236" rx="16" fill="white" stroke="#dce6ee"/>
    <rect x="408" y="76" width="304" height="236" rx="16" fill="white" stroke="#dce6ee"/>
    <rect x="784" y="76" width="304" height="236" rx="16" fill="white" stroke="#dce6ee"/>
    <path d="M350 194H392M726 194H768" stroke="#7890a5" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="64" cy="112" r="15" fill="#e7f1fc"/><text x="64" y="117" text-anchor="middle" fill="#1f61a7" font-size="15" font-weight="700">1</text>
    <text x="92" y="118" fill="#15324a" font-size="21" font-weight="700">Choose inputs</text>
    <text x="56" y="169" fill="#34566f" font-size="17">Machine and node profiles</text>
    <text x="56" y="206" fill="#34566f" font-size="17">Jobs, arrivals and queues</text>
    <text x="56" y="243" fill="#34566f" font-size="17">Solar, wind and grid carbon</text>
    <text x="56" y="282" fill="#73889b" font-size="14">Repeat with the same workload</text>
    <circle cx="440" cy="112" r="15" fill="#e4f6ef"/><text x="440" y="117" text-anchor="middle" fill="#167452" font-size="15" font-weight="700">2</text>
    <text x="468" y="118" fill="#15324a" font-size="21" font-weight="700">Simulate decisions</text>
    <text x="432" y="169" fill="#34566f" font-size="17">Scheduling + runtime progress</text>
    <text x="432" y="206" fill="#34566f" font-size="17">DVFS + node power states</text>
    <text x="432" y="243" fill="#34566f" font-size="17">Energy budgets + battery use</text>
    <text x="432" y="282" fill="#73889b" font-size="14">Coordinated by Vessim / Mosaik</text>
    <circle cx="816" cy="112" r="15" fill="#fff3dd"/><text x="816" y="117" text-anchor="middle" fill="#936015" font-size="15" font-weight="700">3</text>
    <text x="844" y="118" fill="#15324a" font-size="21" font-weight="700">Inspect outcomes</text>
    <text x="808" y="169" fill="#34566f" font-size="17">Job completion and waiting</text>
    <text x="808" y="206" fill="#34566f" font-size="17">Energy, grid import and CO₂</text>
    <text x="808" y="243" fill="#34566f" font-size="17">Timelines, plots and CSVs</text>
    <text x="808" y="282" fill="#73889b" font-size="14">Compare policies and supply profiles</text>
  </g>
</svg>
